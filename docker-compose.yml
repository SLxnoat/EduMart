services:
  # MySQL 8.0 Database Service
  db:
    image: mysql:8.0
    container_name: edumart_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-edumart}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-edumart_secure_pass_2026}}
      MYSQL_USER: ${DB_USER:-edumart_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-edumart_secure_pass_2026}
    ports:
      # Defaults host to port 3308 to avoid colliding with any host MySQL running on 3306
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/database_schema.sql:/docker-entrypoint-initdb.d/01_database_schema.sql:ro
    networks:
      - edumart_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-edumart_secure_pass_2026} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Backend Express API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edumart_server
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-edumart}
      DB_USER: ${DB_USER:-edumart_user}
      DB_PASSWORD: ${DB_PASSWORD:-edumart_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-edumart_jwt_secret_production_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTO_SEED: ${AUTO_SEED:-false}
      # Payment Gateway Configurations
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # EmailJS / SMTP
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Gemini AI Chatbot
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edumart_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend React / Nginx Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    container_name: edumart_client
    restart: always
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edumart_network

  # Seeder Service (Run on demand via: docker compose --profile seed run seed)
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edumart_seeder
    command: ["node", "src/scripts/resetDatabase.js"]
    environment:
      NODE_ENV: production
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-edumart}
      DB_USER: ${DB_USER:-edumart_user}
      DB_PASSWORD: ${DB_PASSWORD:-edumart_secure_pass_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@edumart.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-securePassword123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edumart_network
    profiles:
      - seed

networks:
  edumart_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local