version: '3.8'

services:
  # MySQL Service
  mysql:
    image: mysql:8.0
    container_name: edumart_mysql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=edumart
      - MYSQL_ROOT_PASSWORD=your_password
      - MYSQL_USER=edumart_user
      - MYSQL_PASSWORD=your_password

  # Backend Service
  backend:
    build: ./server
    container_name: edumart_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      - NODE_ENV=development

  # Frontend Service
  frontend:
    build: ./client
    container_name: edumart_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: